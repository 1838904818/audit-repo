name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve audit-repo. Do not include secrets or private repository contents.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA where the problem occurs.
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Codex Skill
        - collect_repo_signals.py
        - compare_repo_signals.py
        - Packaging or release assets
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands, inputs, and the smallest safe example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Codex surface if applicable.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private repository contents from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
