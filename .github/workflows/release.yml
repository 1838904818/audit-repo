name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full test suite
        run: python -B -m unittest discover -s scripts -p "test_*.py"

  package:
    name: Package Skill
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build deterministic assets
        run: python scripts/package_skill.py --version "${GITHUB_REF_NAME}" --output-dir dist
      - name: Verify checksum
        run: cd dist && sha256sum --check "audit-repo-${GITHUB_REF_NAME}.zip.sha256"
      - name: Exercise packaged Skill
        run: |
          python -m zipfile -e "dist/audit-repo-${GITHUB_REF_NAME}.zip" dist/extracted
          python dist/extracted/audit-repo/scripts/collect_repo_signals.py dist/extracted/audit-repo --scope-id packaged-skill --format json --output dist/package-smoke.json
          python dist/extracted/audit-repo/scripts/compare_repo_signals.py dist/package-smoke.json dist/package-smoke.json --format markdown --fail-on-attention --require-comparable
          python dist/extracted/audit-repo/scripts/check_repo.py dist/extracted/audit-repo --scope-id packaged-skill --output-dir dist/runner-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/audit-repo-${{ github.ref_name }}.zip
            dist/audit-repo-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "audit-repo-${GITHUB_REF_NAME}.zip*" \
              --dir existing-release
            cmp "dist/audit-repo-${GITHUB_REF_NAME}.zip" "existing-release/audit-repo-${GITHUB_REF_NAME}.zip"
            cmp "dist/audit-repo-${GITHUB_REF_NAME}.zip.sha256" "existing-release/audit-repo-${GITHUB_REF_NAME}.zip.sha256"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "audit-repo ${GITHUB_REF_NAME}"
          fi
