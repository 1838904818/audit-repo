name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest scripts/test_collect_repo_signals.py
      - name: Exercise Markdown output
        run: python scripts/collect_repo_signals.py . --format markdown
      - name: Exercise JSON output
        run: python scripts/collect_repo_signals.py . --format json --output repo-signals.json
