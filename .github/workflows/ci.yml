name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -B -m unittest discover -s scripts -p "test_*.py"
      - name: Exercise Markdown output
        run: python scripts/collect_repo_signals.py . --format markdown
      - name: Exercise JSON output
        run: python scripts/collect_repo_signals.py . --scan-mode tracked --scope-id ci-repository --format json --output "${{ runner.temp }}/repo-signals.json"
      - name: Exercise snapshot comparison
        run: python scripts/compare_repo_signals.py "${{ runner.temp }}/repo-signals.json" "${{ runner.temp }}/repo-signals.json" --format markdown --fail-on-attention --require-comparable
