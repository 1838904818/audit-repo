name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -B -m unittest discover -s scripts -p "test_*.py"
      - name: Exercise Markdown output
        run: python scripts/collect_repo_signals.py . --format markdown
      - name: Exercise JSON output
        run: python scripts/collect_repo_signals.py . --format json --output repo-signals.json
      - name: Exercise snapshot comparison
        run: python scripts/compare_repo_signals.py repo-signals.json repo-signals.json --format markdown
